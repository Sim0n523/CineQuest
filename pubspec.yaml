name: cinequest
description: "A gamified movie-tracking app — level up your cinema life."
publish_to: 'none'
version: 0.8.3+19

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Firebase
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.3
  cloud_firestore: ^6.1.2

  # TMDB
  http: ^1.3.0

  # UI
  google_fonts: ^8.0.2
  cached_network_image: ^3.4.1
  intl: ^0.19.0

  # Location (OpenStreetMap-based — no API key or billing account needed,
  # unlike Google Maps. See README for why.)
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  geolocator: ^14.0.3

  # Camera (Movie Memories — attach a photo when logging a movie)
  camera: ^0.12.0+1
  path_provider: ^2.1.5
  # Gallery upload alternative to the camera capture flow. Exact-pinned,
  # not caret — the current latest image_picker needs Dart 3.12+, and an
  # intermediate version needs Dart 3.10+; both exceed this project's
  # Dart 3.9.2 floor. 1.2.1 is confirmed (via its own pubspec.yaml) to
  # need only Dart >=3.7.0, so it's used here exactly, not ^1.2.1 — a
  # caret range could still resolve to one of those newer, incompatible
  # versions since they're all 1.x. Same class of issue that already
  # broke pub get once with the camera package — see toolchain notes.
  image_picker: 1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # App icon generation (v0.8.1+17). Dev-only — not needed at runtime,
  # only when you run the icon-generation command below after a
  # `flutter pub get`. Verified min Dart SDK 3.0 on pub.dev, well under
  # this project's 3.9.2 floor. See README "App icon" section for the
  # one-time command to run.
  flutter_launcher_icons: ^0.14.4

  # Native splash screen (v0.8.2+18). Fixes the white screen Flutter
  # shows by default before the engine loads (this is a separate thing
  # from lib/screens/splash_screen.dart, which only runs *after* the
  # engine is up and already uses AppColors.background correctly).
  # Dev-only — see README "Native splash screen" section for the
  # one-time command.
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

# Config read by flutter_launcher_icons. The source image is the
# finished 1024x1024 master icon (gold play mark + blue segmented ring
# on the app's navy background) — see README "App icon" section for
# the exact command to actually generate the launcher icons from it.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

# Config read by flutter_native_splash. Reuses the same master icon,
# centered on the app's real navy background instead of default white.
# See README "Native splash screen" section for the exact command.
flutter_native_splash:
  color: "#0B132B"
  image: "assets/icon/icon.png"
  android_12:
    color: "#0B132B"
    image: "assets/icon/icon.png"
